name: BlitzDev FinTech PR Guardian

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  fintech-security-scan:
    name: AST Invariant & Concurrency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Deterministic Database
        run: |
          python -m demo_api.seed

      - name: Run AST Invariant Scanner
        run: |
          python -m blitzdev_agent.scanner

      - name: Execute Remediated Concurrency Tests
        run: |
          python -m pytest -s tests/test_concurrency_remediated.py

      - name: Upload SARIF Security Telemetry
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: output/blitzdev_report.sarif
          category: blitzdev-ast-guardian

      - name: Archive BlitzDev Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blitzdev-audit-deliverables
          path: |
            output/audit_report.md
            output/blitzdev_report.sarif
